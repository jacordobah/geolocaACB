name: acb-gps-lo

services:
  gps:
    image: acb-gps-lo:dev
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      GPS_HTTP_PORT: ${GPS_HTTP_PORT:-8080}
      GPS_REDIS_ADDR: ${GPS_REDIS_ADDR:-redis:6379}
      GPS_REDIS_DIAL_TIMEOUT: ${GPS_REDIS_DIAL_TIMEOUT:-2s}
      GPS_REDIS_PING_TIMEOUT: ${GPS_REDIS_PING_TIMEOUT:-1s}
      GPS_SHUTDOWN_TIMEOUT: ${GPS_SHUTDOWN_TIMEOUT:-20s}
    ports:
      - "127.0.0.1:${GPS_HOST_PORT:-8081}:${GPS_HTTP_PORT:-8080}"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/acb-gps", "healthcheck"]
      interval: 10s
      timeout: 4s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - gps-net

  redis:
    image: redis:8.2.9-bookworm@sha256:66b7f4c2f3c6ef1b298bbd7b13c806bc6f71e61f1136a4f58710daf2cb053b21
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - ${REDIS_AOF_FSYNC:-always}
      - --maxmemory
      - ${REDIS_MAXMEMORY:-512mb}
      - --maxmemory-policy
      - noeviction
    volumes:
      - gps-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - gps-net

volumes:
  gps-redis-data:

networks:
  gps-net:
