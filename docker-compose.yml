include:
  - path: ./acb_gps_lo/compose.yaml

services:
  acb_mongo_db:
    image: mongo:8.0
    command: ["mongod", "--bind_ip_all", "--tlsMode", "requireTLS", "--tlsCertificateKeyFile", "/run/acb-tls/mongo.pem", "--tlsCAFile", "/run/acb-tls/ca.crt", "--tlsAllowConnectionsWithoutCertificates"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
      - ${ACB_TLS_DIR:?Set external ACB_TLS_DIR}/mongo.pem:/run/acb-tls/mongo.pem:ro
      - ${ACB_TLS_DIR:?Set external ACB_TLS_DIR}/ca.crt:/run/acb-tls/ca.crt:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--tls", "--tlsCAFile", "/run/acb-tls/ca.crt", "--host", "acb_mongo_db", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  acb_path_lo:
    build:
      context: ./acb_path_lo
      dockerfile: Dockerfile
    environment:
      MONGO_URI: mongodb://acb_mongo_db:27017/?tls=true&tlsCAFile=/run/acb-tls/ca.crt
      MONGO_DATABASE: geolocaacb
    command:
      - uvicorn
      - acb_path_lo.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --ssl-certfile
      - /run/acb-tls/paths.crt
      - --ssl-keyfile
      - /run/acb-tls/paths.key
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - type: bind
        source: ${ACB_TLS_DIR:?Set external ACB_TLS_DIR}/paths.crt
        target: /run/acb-tls/paths.crt
        read_only: true
      - type: bind
        source: ${ACB_TLS_DIR:?Set external ACB_TLS_DIR}/paths.key
        target: /run/acb-tls/paths.key
        read_only: true
      - type: bind
        source: ${ACB_TLS_DIR:?Set external ACB_TLS_DIR}/ca.crt
        target: /run/acb-tls/ca.crt
        read_only: true
    depends_on:
      acb_mongo_db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import ssl, urllib.request; c=ssl.create_default_context(cafile='/run/acb-tls/ca.crt'); urllib.request.urlopen('https://geoloca-api:8000/openapi.json', context=c, timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      default: {}
      acb-net:
        aliases:
          - geoloca-api

  acb_gps_lo:
    environment:
      GPS_GATEWAY_BASE_URL: https://api-gateway:5062
      GPS_GATEWAY_ROUTES_PATH: ${GPS_GATEWAY_ROUTES_PATH:-/api/v1/routes/{route_id}}
    networks:
      gps-net: {}
      acb-net:
        aliases:
          - geoloca-gps

volumes:
  mongo_data:

networks:
  acb-net:
    external: true
    name: acb-net
